services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: formstore
      POSTGRES_PASSWORD: formstore
      POSTGRES_DB: formstore
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formstore -d formstore"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
